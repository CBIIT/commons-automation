# Converted from Katalon Object Repository/INS/DataSets
page: DataSets
elements:
  Description: //*[@class='textSpan']
  Next-Btn: //*[contains(@class, 'bspage-link-next')]
  ParticipantCount: //*[@class='textSpan caseCountHighlight']
  PrimaryDisease: //*[@class='itemSpan']
  RowPerPaDd-Value: //*[@class='dropdown']//li[normalize-space(.)='100']
  RowsPerPage-Dd: //*[@class='dropdown']/button
  SampleCount: //*[@class='textSpan sampleCountHighlight']
  Title: //a[starts-with(@href, '#/dataset/phs')]
  sourceID: //a[starts-with(@href, 'https://cedcd') or starts-with(@href, 'https://www.ncbi.nlm')]
groups:
  DataSets/Repository:
    checkboxes:
      CEDCD: //*[@value='CEDCD']
      GEO: //*[@value='GEO']
      dbGaP: //*[@value='dbGaP']
