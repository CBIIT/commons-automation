page: FileCart
elements:
  Navigation: //a[contains(@href,'fileCentricCart')]
  Badge: //a[contains(@href,'fileCentricCart')]//*[not(*) and string-length(normalize-space(.))>0 and translate(normalize-space(.),'0123456789,','')='']
  Table: //table[thead/tr/th[normalize-space(.)='File Name']]
  SourceTable: //table[thead/tr/th[normalize-space(.)='File Name']]
  Next: //button[@aria-label='Next page']
  Previous: //button[@aria-label='Previous page']
  SourceNext: //button[@aria-label='Next page']
  SourcePrevious: //button[@aria-label='Previous page']
  PageStatus: "//p[contains(translate(normalize-space(.),'OF','of'),'of ') and (contains(.,'-') or contains(.,'\u2013\
    '))]"
  PageSize: //*[@role='button' and @aria-haspopup='listbox']
  AddSelected: //button[translate(normalize-space(.),'abcdefghijklmnopqrstuvwxyz','ABCDEFGHIJKLMNOPQRSTUVWXYZ')='ADD
    SELECTED FILES']
  Export: //button[contains(translate(normalize-space(.),'abcdefghijklmnopqrstuvwxyz','ABCDEFGHIJKLMNOPQRSTUVWXYZ'),'EXPORT')
    and (contains(translate(normalize-space(.),'abcdefghijklmnopqrstuvwxyz','ABCDEFGHIJKLMNOPQRSTUVWXYZ'),'OPTIONS')
    or contains(translate(normalize-space(.),'abcdefghijklmnopqrstuvwxyz','ABCDEFGHIJKLMNOPQRSTUVWXYZ'),'DOWNLOAD'))]
  Manifest: //button[translate(normalize-space(.),'abcdefghijklmnopqrstuvwxyz','ABCDEFGHIJKLMNOPQRSTUVWXYZ')='DOWNLOAD
    MANIFEST']
  SourceTab: //button[@role='tab' and starts-with(normalize-space(.),'Files')]
  AddAll: //button[translate(normalize-space(.),'abcdefghijklmnopqrstuvwxyz','ABCDEFGHIJKLMNOPQRSTUVWXYZ')='ADD
    ALL FILES']
  RowRemove: .//button[@aria-label='Delete row']
  RemoveAll: //thead//button[@aria-label='help']
  RemovalDialog: //*[@role='dialog' and @aria-describedby='alert-dialog-description']
  RemovalMessage: //*[@id='alert-dialog-description']
  Empty: //*[not(*) and normalize-space(.)='No Matching Records Found']
  Guide: //button[translate(normalize-space(.),'abcdefghijklmnopqrstuvwxyz','ABCDEFGHIJKLMNOPQRSTUVWXYZ')='README']
  GuideDialog: //*[@role='dialog' and .//*[@id='readMe_content']]
  GuideClose: //*[@role='dialog' and .//*[@id='readMe_content']]//button[.//*[local-name()='svg']]
  CGC: //*[@role='menuitem'][contains(translate(normalize-space(.),'abcdefghijklmnopqrstuvwxyz','ABCDEFGHIJKLMNOPQRSTUVWXYZ'),'EXPORT
    TO CANCER GENOMICS CLOUD')]
  SelectedScope: //input[@type='radio' and @value='false']
  StudySourceTab: //button[@role='tab' and starts-with(normalize-space(.),'Study Files')]
  Catalog: //*[@id='studies_table']//table | //table[@id='studies_table']
  CatalogNext: //*[@id='studies_table']//button[@aria-label='Next page']
  AddAllDialog: //*[@role='dialog' and @aria-describedby='alert-dialog-description']
  AddAllMessage: //*[@id='alert-dialog-description']
  StudyFacet: //*[@role='button' and @aria-expanded and normalize-space(.)='Study']
  StudyAccession: //*[@role='button' and (@id='PHS Accession' or @id='Study Accession')]
  StudyCheckbox: //input[@type='checkbox' and (@id='checkbox_PHS Accession_{value}' or @id='checkbox_Study Accession_{value}')]/ancestor::div[1]
  StudySearch: //*[@role='button' and (@id='PHS Accession' or @id='Study Accession')]/parent::div//input[@aria-label='Search
    within Study facet']
