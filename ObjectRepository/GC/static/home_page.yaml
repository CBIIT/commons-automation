  FooterDataModelLink: //a[normalize-space(.)='Data Model']
  FooterDisclaimerLink: //a[normalize-space(.)='Disclaimer']
  FooterFOIALink: //a[normalize-space(.)='FOIA']
  FooterGraphQLLink: //a[normalize-space(.)='GraphQL']
