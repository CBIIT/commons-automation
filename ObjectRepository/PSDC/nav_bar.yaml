page: NavBar
elements:
  Home-Btn: //a[@href='#/' and normalize-space(.)='Home']
  Explore-Btn: //a[@href='#/explore' and normalize-space(.)='Explore']
  About-Tab: //div[contains(concat(' ',normalize-space(@class),' '),' desktop ')]//*[@id='navbar-dropdown-about' and @role='button']
  AboutPage-Link: //div[contains(concat(' ',normalize-space(@class),' '),' desktop ')]//a[@id='navbar-dropdown-item-about']
  AccessData-Link: //div[contains(concat(' ',normalize-space(@class),' '),' desktop ')]//a[@id='navbar-dropdown-item-access-data']
  AnalyzeData-Link: //div[contains(concat(' ',normalize-space(@class),' '),' desktop ')]//a[@id='navbar-dropdown-item-analyze-data']
  Support-Link: //div[contains(concat(' ',normalize-space(@class),' '),' desktop ')]//a[@id='navbar-dropdown-item-support']
