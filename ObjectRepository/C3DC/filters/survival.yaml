    checkboxes:
      NotReported: //*[@id="checkbox_First Event_Not Reported"]
  Survival/LastKnownSurStatus:
    facet: (//*[text()="Survival"])[1]
    dropdown: //*[@id="Last Known Survival Status"]
    checkbox_template: //*[@id="checkbox_Last Known Survival Status_{value}"]
