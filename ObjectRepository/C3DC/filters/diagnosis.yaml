page: Filters/Diagnosis
groups:
  Diagnosis/AgeAtDiagnosis:
    facet: (//*[text()='Diagnosis'])[1]
    dropdown: (//*[@id="Race"])[1]
    other:
      Age-Slidr: //*[@id="checkbox_Race_Asian"]
  Diagnosis/AnatomicSite:
    facet: (//*[text()='Diagnosis'])[1]
    dropdown: (//*[@id="Diagnosis Anatomic Site"])[1]
    search: //input[contains(@placeholder,'blood, brain, kidney')]
    checkboxes:
      # Explore uses Uberon-style labels (not ICD-O codes) in checkbox ids.
      C420_Blood: '//*[@id="checkbox_Diagnosis Anatomic Site_blood"]'
      AdrenalGland: '//*[@id="checkbox_Diagnosis Anatomic Site_adrenal gland"]'
      Arm: '//*[@id="checkbox_Diagnosis Anatomic Site_arm"]'
      AutonNervSysNOS: '//*[@id="checkbox_Diagnosis Anatomic Site_autonomic nervous system"]'
      Blood: '//*[@id="checkbox_Diagnosis Anatomic Site_blood"]'
      BoneElement: '//*[@id="checkbox_Diagnosis Anatomic Site_bone element"]'
      BoneNOS: '//*[@id="checkbox_Diagnosis Anatomic Site_limb bone"]'
      Breast: '//*[@id="checkbox_Diagnosis Anatomic Site_breast"]'
      C01.9.BaseOfTongue,NOS: '//*[@id="checkbox_Diagnosis Anatomic Site_base of tongue"]'
      C029TongueNOS: '//*[@id="checkbox_Diagnosis Anatomic Site_tongue"]'
      C05.0.HardPalate: '//*[@id="checkbox_Diagnosis Anatomic Site_hard palate"]'
      C05.1.SoftPalate,NOS: '//*[@id="checkbox_Diagnosis Anatomic Site_soft palate"]'
      C06.9.Mouth,NOS: '//*[@id="checkbox_Diagnosis Anatomic Site_mouth"]'
      C060CheekMucosa: '//*[@id="checkbox_Diagnosis Anatomic Site_cheek mucosa"]'
      C07.9 ParotidGland: '//*[@id="checkbox_Diagnosis Anatomic Site_parotid gland"]'
      C08.0.SubmandibularGland: '//*[@id="checkbox_Diagnosis Anatomic Site_submandibular gland"]'
      C08.9.MajorSalivaryGland,NOS: '//*[@id="checkbox_Diagnosis Anatomic Site_major salivary gland"]'
      C10.9.Oropharynx,NOS: '//*[@id="checkbox_Diagnosis Anatomic Site_oropharynx"]'
      C11.2.LateralWallOfNasopharynx: '//*[@id="checkbox_Diagnosis Anatomic Site_lateral wall of nasopharynx"]'
      C11.9.Nasopharynx,NOS: '//*[@id="checkbox_Diagnosis Anatomic Site_nasopharynx"]'
      C22LiverIntrehapatic: '//*[@id="checkbox_Diagnosis Anatomic Site_liver"]'
      C421BoneMarrow: '//*[@id="checkbox_Diagnosis Anatomic Site_bone marrow"]'
      C649KidneyNOS: '//*[@id="checkbox_Diagnosis Anatomic Site_kidney"]'
      CerbralMenings: '//*[@id="checkbox_Diagnosis Anatomic Site_cerebral meninges"]'
      LipNOS: '//*[@id="checkbox_Diagnosis Anatomic Site_lip"]'
      Liver: '//*[@id="checkbox_Diagnosis Anatomic Site_liver"]'
      NotReported: //*[@id="checkbox_Diagnosis Anatomic Site_Not Reported"]
      ParotidGland: '//*[@id="checkbox_Diagnosis Anatomic Site_parotid gland"]'
  Diagnosis/Diagnosis:
    facet: (//*[text()='Diagnosis'])[1]
    dropdown: //*[@id='Diagnosis' and @role='button']
    search: //input[contains(@placeholder,'sarcoma') or contains(@placeholder,'Sarcoma')]
    checkboxes:
      8000-0-Neoplasm,benign: '//*[@id="checkbox_Diagnosis Classification_8000/0 :
        Neoplasm, benign"]'
      8000-1-Neoplasm,uncertainwhether,benign: '//*[@id="checkbox_Diagnosis Classification_8000/1
        : Neoplasm, uncertain whether benign or malignant"]'
      8000-3-Neoplasm,malignant: '//*[@id="checkbox_Diagnosis Classification_8000/3
        : Neoplasm, malignant"]'
      80103CarciNOS: //*[@id="checkbox_Diagnosis_Carcinoma, NOS"]
      88003SarcomaNOS: '//*[@id="checkbox_Diagnosis_Sarcoma, NOS"]'
      89643ClearSarcKidney: //*[@id="checkbox_Diagnosis_Clear cell sarcoma of kidney"]
      95003NeurNOS: '//*[@id="checkbox_Diagnosis_Neuroblastoma, NOS"]'
      9540NeurofibroNOS: '//*[@id="checkbox_Diagnosis_Neurofibromatosis, NOS"]'
      98113.B.lymphoblaLeukNOS: '//*[@id="checkbox_Diagnosis_B lymphoblastic leukemia/lymphoma, NOS"]'
      98373TlymphLymphoma: '//*[@id="checkbox_Diagnosis_T lymphoblastic leukemia/lymphoma"]'
      AcuteBip: '//*[@id="checkbox_Diagnosis_Acute biphenotypic leukemia"]'
      AcuteLeukAmbLing: //*[@id="checkbox_Diagnosis_Acute Leukemias of Ambiguous Lineage"]
      AcuteLeukemiaNOS: '//*[@id="checkbox_Diagnosis_Acute leukemia, NOS"]'
      AcuteMyelLeukNOS: //*[@id="checkbox_Diagnosis_Acute myeloid leukemia, NOS"]
      AdenomaNOS: //*[@id="checkbox_Diagnosis_Adenoma, NOS"]
      EwingSarcoma: //*[@id="checkbox_Diagnosis_Ewing sarcoma"]
      Ganglioneuroblastoma: //*[@id="checkbox_Diagnosis_Ganglioneuroblastoma"]
      JuvenileMyLeNOS: '//*[@id="checkbox_Diagnosis_Juvenile myelomonocytic leukemia, NOS"]'
      Lipoma: //*[@id="checkbox_Diagnosis_Lipoma"]
      NeoplsmBen: //*[@id="checkbox_Diagnosis_Neoplasm, benign"]
      NephroblastomaNOS: //*[@id="checkbox_Diagnosis_Nephroblastoma, NOS"]
      Neuroblastoma: //*[@id="checkbox_Diagnosis_Neuroblastoma"]
      NeuroblastomaNOS: //*[@id="checkbox_Diagnosis_Neuroblastoma, NOS"]
      NeurofibromatosisNOS: //*[@id="checkbox_Diagnosis_Neurofibromatosis, NOS"]
      OsteosarNOS: //*[@id="checkbox_Diagnosis_Osteosarcoma, NOS"]
      RhabdoidTumNOS: '//*[@id="checkbox_Diagnosis_Rhabdoid tumor, NOS"]'
      RhabdoidTumorNOS: //*[@id="checkbox_Diagnosis_Rhabdoid tumor, NOS"]
      SarcomaNOS: //*[@id="checkbox_Diagnosis_Sarcoma, NOS"]
      SmalCelCarciNOS: //*[@id="checkbox_Diagnosis_Small cell carcinoma, NOS"]
    other:
      OsteosarNOS-Chkbx - Copy: '//*[@id="checkbox_Diagnosis_9180/3 : Osteosarcoma,
        NOS"]'
  Diagnosis/DiagnosisBasis:
    facet: (//*[text()='Diagnosis'])[1]
    dropdown: (//*[@id="Diagnosis Basis"])[1]
    checkboxes:
      Clinical: //*[@id="checkbox_Diagnosis Basis_Clinical"]
      NotReported: //*[@id="checkbox_Diagnosis Basis_Not Reported"]
      Pathology: //*[@id="checkbox_Diagnosis Basis_Pathology"]
      Unknown: //*[@id="checkbox_Diagnosis Basis_Unknown"]
  Diagnosis/DiagsClasifctnSystem:
    facet: (//*[text()='Diagnosis'])[1]
    dropdown: (//*[@id="Diagnosis Classification System"])[1]
    checkboxes:
      ICD-O-3.2: //*[@id="checkbox_Diagnosis Classification System_ICD-O-3.2"]
      IndForStudy: //*[@id="checkbox_Diagnosis Classification System_Indication for
        Study"]
      WHO: //*[@id="checkbox_Diagnosis Classification System_WHO CNS5 Integrated Diagnosis"]
  Diagnosis/DiagnosisCategory:
    facet: (//*[text()='Diagnosis'])[1]
    dropdown: //*[@id='Diagnosis Category' and @role='button']
    search: //input[contains(@placeholder,'sarcoma') or contains(@placeholder,'neoplasm') or contains(@placeholder,'leukemia')]
    checkboxes:
      Gliomas: //*[@id="checkbox_Diagnosis Category_Gliomas"]
  Diagnosis/DiseasePhase:
    facet: (//*[text()='Diagnosis'])[1]
    dropdown: (//*[@id="Disease Phase"])[1]
    checkboxes:
      IndicationForStudy: //*[@id="checkbox_Race_Asian"]
      InitialDiag: //*[@id="checkbox_Disease Phase_Initial Diagnosis"]
      NotReported: //*[@id="checkbox_Disease Phase_Not Reported"]
      RelapProgrsion: //*[@id="checkbox_Disease Phase_Relapse/Progression"]
      Progression: //*[@id="checkbox_Disease Phase_Progression"]
      Relapse: //*[@id="checkbox_Disease Phase_Relapse"]
      PostMortem: //*[@id="checkbox_Disease Phase_Post-Mortem"]
      Unknown: //*[@id="checkbox_Disease Phase_Unknown"]
