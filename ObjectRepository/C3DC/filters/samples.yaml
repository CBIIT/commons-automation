page: Filters/Samples
groups:
  Samples/AnatomicSite:
    facet: (//*[@id="[object Object]"])[3]
    dropdown: //*[@id="Anatomic site"]
    checkboxes:
      BloodC42.0: '//*[@id="checkbox_Anatomic site_C42.0 : Blood"]'
      Blood: //*[@id="checkbox_Anatomic site_Blood"]
      InvalidValue: //*[@id="checkbox_Anatomic site_Invalid value"]
      Kidney: '//*[@id="checkbox_Anatomic site_C64.9 : Kidney, NOS"]'
      NasalCavity: '//*[@id="checkbox_Anatomic site_C30.0 : Nasal cavity"]'
      NotReported: //*[@id="checkbox_Anatomic site_Not Reported"]
      Retroperitoneum: '//*[@id="checkbox_Anatomic site_C48.0 : Retroperitoneum"]'
      UnknownPrimSite: '//*[@id="checkbox_Anatomic site_C80 : UNKNOWN PRIMARY SITE"]'
      UpperLimb: '//*[@id="checkbox_Anatomic site_C76.4 : Upper limb, NOS"]'
    other:
      LymphNodeLeg: '//*[@id="checkbox_Anatomic site_C77.4 : Lymph nodes of inguinal
        region or leg"]'
  Samples/SampleTumorClassification:
    facet: (//*[@id="[object Object]"])[3]
    dropdown: //*[@id="Tumor classification"]
    checkboxes:
      NotApplicable: //*[@id="checkbox_Tumor classification_Not Applicable"]
      NotReported: //*[@id="checkbox_Tumor classification_Not Reported"]
      Metastatic: //*[@id="checkbox_Tumor classification_Metastatic"]
      Primary: //*[@id="checkbox_Tumor classification_Primary"]
      Regional: //*[@id="checkbox_Tumor classification_Regional"]
      Unknown: //*[@id="checkbox_Tumor classification_Unknown"]
  Samples/SampleTumorStatus:
    facet: (//*[@id="[object Object]"])[3]
    dropdown: //*[@id="Sample tumor status"]
    checkboxes:
      Normal: //*[@id="checkbox_Sample tumor status_Normal"]
      Tumor: //*[@id="checkbox_Sample tumor status_Tumor"]
      Unknown: //*[@id="checkbox_Sample tumor status_Unknown"]
