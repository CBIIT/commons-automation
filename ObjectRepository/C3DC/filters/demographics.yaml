      AmerIndAlaskan: //*[@id="checkbox_Race_American Indian or Alaska Native"]
      BlkAfricAmer: //*[@id="checkbox_Race_Black or African American"]
      HispOrLatino: //*[@id="checkbox_Race_Hispanic or Latino"]
      NativeHawaiianPacific: //*[@id="checkbox_Race_Native Hawaiian or other Pacific Islander"]
      NotAlwdToCollect: //*[@id="checkbox_Race_Not Allowed to Collect"]
      NotReported: //*[@id="checkbox_Race_Not Reported"]
  Demographics/SexAtBirth:
    facet_key: Demographics_Facet
    dropdown: (//*[@id="Sex at Birth"])[1]
    checkbox_template: //*[@id="checkbox_Sex at Birth_{value}"]
    values: [Female, Male, Unknown]
