page: CohortAnalyzer
elements:
  Navigation: //a[@href='/cohortAnalyzer']
  AddExamples: //button[normalize-space(.)='Add Example Cohorts']
  Selector: //span[normalize-space(.)='Cohort Selector']/parent::div
  # Each cohort has a single checkbox image; its displayed name is duplicated for overflow tooltips.
  Items: //button[normalize-space(.)='Add Example Cohorts']/parent::div/parent::div/parent::div//img[starts-with(@alt,'checkbox ')]
  # Relative to a cohort's checkbox image. Read only the first display label.
  ItemLabel: ./parent::div/following-sibling::span/span/span[1]
  ChartView: //button[normalize-space(.)='Chart Summary View']
  TableView: //button[normalize-space(.)='Table View']
  Readme: //button[normalize-space(.)='README']
  ReadmeClose: //button[@aria-label='close']
  SortAlphabetically: //p[normalize-space(.)='Sort Alphabetically']/parent::div
  SortByCount: //p[normalize-space(.)='Sort by Count']/parent::div
  SidebarRow: ./parent::div/parent::div/parent::div
  DeleteOne: .//img[@alt='Trashcan' and @role='button']
  DeleteAll: //span[normalize-space(.)='Cohort Selector']/parent::div/following-sibling::img[@alt='Trashcan']
  Canvas: //canvas[@id='canvas']
  VennCard: //h2[normalize-space(.)='Venn Diagram']/parent::div/parent::div/parent::div
  MatchingCategory: .//input[@name='node_type']
  ExpandVenn: //button[@aria-label='Expand Venn diagram']
  DownloadVenn: //button[@aria-label='Download Venn diagram']
  ExpandSurvival: //button[@aria-label='Expand survival chart']
  DownloadSurvival: //button[@aria-label='Survival chart download options']
  SurvivalCard: //button[@aria-label='Expand survival chart']/parent::div/parent::div/parent::div
  RiskTable: //table[.//th[contains(normalize-space(.),'Months')]]
  AddChart: //button[@aria-label='Add chart']
  AddChartBelow: //button[@aria-label='Add chart below histograms']
  ChartOptions: //*[@role='listbox' and @aria-label='Choose chart type']
  ChartType: .//button[@aria-label='Chart type']
  HistogramCards: //*[@data-ca-chart-title-text='true']/ancestor::div[@draggable][1]
  HistogramTitle: .//*[@data-ca-chart-title-text='true']
  HistogramExpand: .//img[contains(@src,'Expand_Histogram_icon')]/parent::span
  HistogramDownload: .//img[contains(@src,'Download_Histogram_icon')]/parent::span
  HistogramRemove: .//button[starts-with(@aria-label,'Remove ') and contains(@aria-label,' from layout')]
  ResetView: //button[normalize-space(.)='Reset View']
  DownloadAll: //button[contains(normalize-space(.),'DOWNLOAD ALL')]
  Table: //table[.//th[normalize-space(.)='Participant Id']]
  TableRows: .//tbody/tr[td[contains(@class,'participant_id')]]
  TableContainer: //table[.//th[normalize-space(.)='Participant Id']]/parent::div/parent::div
  NextPage: (.//button[@aria-label='Next page'])[1]
  PreviousPage: (.//button[@aria-label='Previous page'])[1]
  PageSize: (.//*[@aria-label='Selection dropdown for displaying the number of results per page'])[1]
  TableDownload: //button[.//img[@alt='expand download icon']]
  ManifestCsv: //li[normalize-space(.)='Manifest CSV']
  MetadataJson: //li[normalize-space(.)='Metadata JSON']
  CreateCohort: //button[normalize-space(.)='CREATE NEW COHORT']
  BuildExplore: //button[contains(normalize-space(.),'BUILD IN') and contains(normalize-space(.),'EXPLORE DASHBOARD')]
  VennHelp: //h2[normalize-space(.)='Venn Diagram']/parent::div/parent::div/parent::div//img[@alt='Help']
  MatchingHelp: //h2[normalize-space(.)='Venn Diagram']/parent::div/parent::div/parent::div//label[input[@aria-label='Diagnosis']]
  DragHelp: //*[@data-ca-chart-title-drag='true'][contains(@aria-label,'Sex at Birth')]
  ResizeHelp: //*[@aria-label='Resize Sex at Birth card']
  PageRange: (.//p[contains(normalize-space(.),' of ')])[1]
  ExpandedClose: //button[normalize-space(.)='Venn Diagrams']/parent::div/following-sibling::div//button[not(@aria-label)]
  ReadmeTopic: //div[@name='Cohort Analyzer']
  ReadmeContent: //*[@id='UserGuideContentSection']
  ItemFullLabel: ./parent::div/following-sibling::span/span/span[2]
  ExploreNotice: //div[.//button[normalize-space(.)='Confirm'] and .//button[normalize-space(.)='Cancel'] and .//input[@type='checkbox']][not(.//div[.//button[normalize-space(.)='Confirm'] and .//button[normalize-space(.)='Cancel'] and .//input[@type='checkbox']])]
  ExploreNoticeMessage: .//*[starts-with(normalize-space(text()),'You are about to leave this page')]
