[pytest]
testpaths = Testcases
python_files = test_*.py
addopts = -ra --strict-markers
markers =
    ins: Index of NCI Studies (INS) tests
    c3dc: C3DC (Childhood Cancer Clinical DataCommons) tests
    ccdi: CCDI Hub tests (no explore page; Explore opens C3DC)
    ctdc: CTDC (Clinical Trials Data Commons) tests
    gc: GC (General Commons) tests
    icdc: ICDC (Integrated Canine Data Commons) tests
    bento: BENTO (TAILORx Explore on bento-tools.org) tests
    smoke: quick sanity subset (Config/suites.yaml per app, or TC01_* legacy)
    sanity: smaller sanity check (Config/suites.yaml; GC and C3DC)
    regression: full regression (Config/suites.yaml or all Excel cases legacy)
    datarelease: C3DC data-release study batch (phs002827, phs003162, phs004232, phs004490)
    quickrun: tiny subset for a fast check (test piplines)
    static: static page text/link verification
    unit: Commons library unit tests (no browser, no network)
