[pytest]
testpaths = Testcases
python_files = test_*.py
addopts = -ra --strict-markers
markers =
    c3dc: C3DC (Clinical Commons) tests
    gc: GC (General Commons) tests
    smoke: quick sanity subset (from the Katalon *_Smoke suites)
    regression: full regression (from the Katalon *_Regression suites)
    quickrun: tiny subset for a fast check (from the Katalon *_QuickRun suites)
    static: static page text/link verification
    unit: Commons library unit tests (no browser, no network)
