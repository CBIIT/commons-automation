# Replaces the Katalon Profiles (*.glbl). Pick one with:  pytest --env qa   (or ENV=qa)
#
# Secrets (Memgraph passwords) are NOT stored here. Put them in a gitignored `.env` or the shell:
#   MEMGRAPH_PASSWORD_C3DC=...     # required for C3DC tests (cluster host under apps.C3DC.memgraph)
#   MEMGRAPH_PASSWORD_CTDC=...     # required for CTDC tests
#   NEO4J_PASSWORD_ICDC=...        # ICDC QA (see NEO4J_PASSWORD_ICDC_PROD for prod)
#   NEO4J_ENDPOINT_ICDC=...        # optional bolt URI override per app/env
#   NEO4J_ENV=qa                   # ICDC: UI env can differ from Neo4j bolt env (local dev)
#   MEMGRAPH_PASSWORD_GC_QA=... MEMGRAPH_PASSWORD_GC_QA2=...  # GC: one password per env
# Optional overrides: MEMGRAPH_ENDPOINT_C3DC, MEMGRAPH_USERNAME_C3DC_QA, etc. (see Commons/settings.py)

apps:
  C3DC:
    # Expected data = Cypher in the input Excel, run against Memgraph (Katalon: ReadExcel.Memgraph).
    expected_source: memgraph
    urls:
      qa:    https://clinicalcommons-qa.ccdi.cancer.gov/
      stage: https://clinicalcommons-stage.ccdi.cancer.gov/
      prod:  https://clinicalcommons.ccdi.cancer.gov/
    memgraph:
      # Override host/user: MEMGRAPH_ENDPOINT_C3DC, MEMGRAPH_USERNAME_C3DC, etc.
      dev:
        endpoint: bolt://gen-dev-cdk-nlb-ecd70c3cab6cb63f.elb.us-east-1.amazonaws.com:7687
        username: memgraph
      qa:
        endpoint: bolt://ccdi-dcc-qa-99d933a8c11c2ea3.elb.us-east-1.amazonaws.com:7687
        username: memgraph

  CTDC:
    expected_source: memgraph
    urls:
      qa:    https://clinical-qa.datacommons.cancer.gov/#/
      stage: https://clinical-stage.datacommons.cancer.gov/#/
      prod:  https://clinical.datacommons.cancer.gov/#/
    memgraph:
      # Override: MEMGRAPH_ENDPOINT_CTDC, MEMGRAPH_USERNAME_CTDC, MEMGRAPH_PASSWORD_CTDC
      qa:
        endpoint: bolt://crdc-c-nlbC3-PnIdn9bEEnH4-90d8fb37076e1f8b.elb.us-east-1.amazonaws.com:7687
        username: admin

  ICDC:
    # Expected data = Cypher in input Excel, run against Neo4j (not Memgraph).
    expected_source: neo4j
    urls:
      qa:    https://caninecommons-qa.cancer.gov/#/
      stage: https://caninecommons-stage.cancer.gov/#/
      prod:  https://caninecommons.cancer.gov/#/
    neo4j:
      # Hosts match Katalon Profiles/ICDC_*.glbl (G_server). Override: NEO4J_ENDPOINT_ICDC_<ENV>
      qa:
        endpoint: bolt://ncidb-q600-c.nci.nih.gov:7687
        username: neo4j
      stage:
        endpoint: bolt://ncias-s2261-c.nci.nih.gov:7687
        username: neo4j
  GC:
    # Expected data = Cypher in the input Excel, run against Memgraph.
    expected_source: memgraph
    urls:
      qa:    https://general-qa.datacommons.cancer.gov/
      qa2:   https://general-qa2.datacommons.cancer.gov/
      stage: https://general-stage.datacommons.cancer.gov/
      prod:  https://datacommons.cancer.gov/
    memgraph:
      qa:
        endpoint: bolt://gen-dev-cdk-nlb-ecd70c3cab6cb63f.elb.us-east-1.amazonaws.com:7687
        username: memgraph
      qa2:
        endpoint: bolt://gen-qa2-cdk-nlb-a4d830d9cb17f0ac.elb.us-east-1.amazonaws.com:7687
        username: memgraph  

browser:
  name: chromium          # chromium | firefox | webkit   (override: BROWSER or --browser)
  headless: true          # override: HEADLESS=false, HEADED=true, or pytest --headed
  viewport: {width: 1920, height: 1080}
  timeout_ms: 30000
