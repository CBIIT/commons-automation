# ---------------------------------------------------------------------------
# Tab compare settings (all apps)
# ---------------------------------------------------------------------------
# Controls how many table rows we compare (UI vs database) and which result
# tabs run during a test. Stat bar counts are always checked.
#
#   tab_row_limit          — max rows read from the UI and returned from DB query
#   pagination_max_pages   — safety cap on "Next page" clicks in the browser
#   tabs.<name>: true      — run this tab (read UI + run DB query + compare)
#   tabs.<name>: false     — skip this tab (test continues; tab marked SKIPPED)
#
# Shell override for row limit only: TAB_ROW_LIMIT or TAB_ROW_LIMIT_<APP>

default_tab_row_limit: 100
default_pagination_max_pages: 50

apps:

  # -------------------------------------------------------------------------
  # C3DC — Clinical Commons (Explore / Participants)
  # Portal: clinicalcommons*.ccdi.cancer.gov
  # -------------------------------------------------------------------------
  C3DC:
    tab_row_limit: 100
    pagination_max_pages: 25
    tabs:
      Participants: true          # People in the study
      Studies: true               # Study records
      Diagnosis: true             # Diagnosis details
      "Genetic Analysis": true    # Genomic / genetic analysis
      Treatments: true            # Treatment records
      "Treatment Responses": true # Response to treatment
      Survival: true              # Survival data
      Samples: true               # Biospecimen samples

  # -------------------------------------------------------------------------
  # GC — General Commons (Data explore)
  # Portal: general-*.datacommons.cancer.gov / datacommons.cancer.gov
  # -------------------------------------------------------------------------
  GC:
    tab_row_limit: 100
    pagination_max_pages: 25
    tabs:
      Participants: true   # People / subjects
      Samples: true        # Sample records
      Files: true          # Data files

  # -------------------------------------------------------------------------
  # ICDC — Integrated Canine Data Commons (Cases explore)
  # Portal: caninecommons*.cancer.gov
  # -------------------------------------------------------------------------
  ICDC:
    tab_row_limit: 18
    pagination_max_pages: 25
    tabs:
      Cases: false          # Canine cases
      Samples: true        # Samples linked to cases
      "Case Files": true   # Files attached to cases
      "Study Files": true   # Files at study level

  # -------------------------------------------------------------------------
  # CTDC — Clinical Trial Data Commons
  # Portal: clinical*.datacommons.cancer.gov
  # -------------------------------------------------------------------------
  CTDC:
    tab_row_limit: 100
    pagination_max_pages: 25
    tabs:
      Participants: true   # Trial participants
      Biospecimens: true   # Biospecimens
      Files: true          # Participant / biospecimen files
      "Study Files": true  # Study-level files
