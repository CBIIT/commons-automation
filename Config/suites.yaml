# Excel testcase suite membership (paths relative to Testcases/<APP>/).
# Glob patterns: pathlib PurePosixPath.match ( * and ** ).
# Suite order per app: quickrun → smoke → regression → datarelease (C3DC only).
#
# Run examples:
#   pytest -m "gc and quickrun" --env qa
#   pytest -m "c3dc and smoke" --env qa
#   pytest -m "ctdc and quickrun" --env qa
#   pytest -m "bento and smoke" --env qa
#   pytest -m "icdc and quickrun" --env qa
#   pytest -m "c3dc and datarelease" --env qa
#
# Apps not listed here keep legacy markers: all cases regression; TC01_* also smoke.

# ---------------------------------------------------------------------------
# GC — General Commons
# ---------------------------------------------------------------------------
GC:
  quickrun:
    - "studies/phs002430/TC01_*.xlsx"
    - "studies/phs000720/TC02_*.xlsx"
  smoke:
    - "studies/phs000720/TC02_GC_phs000720_Sex_Male.xlsx"
    - "studies/phs000720/TC03_GC_phs000720_FileType_TIFF.xlsx"
    - "studies/phs000720/TC06_GC_phs000720_PrimDiag_NotApplicable.xlsx"
    - "studies/phs001524/TC02_GC_phs001524_SampleTumorStatus-NSD_SampleType-Blood.xlsx"
    - "studies/phs001713/TC05_GC_phs001713_LibrarySource-Genomic_LibraryLayout-PairedEnd.xlsx"
    - "studies/phs002430/TC06_GC_phs002430_RefGenAsbly-NSD_PrimDiag-Acutemyloidleukemia.xlsx"
  regression:
    - "studies/**/TC*.xlsx"
    - "static/TC*.xlsx"
    - "study_listing/TC*.xlsx"

