    - "studies/phs000466/TC02_C3DC_phs000466_Race-BlackAfriAmerican.xlsx"
    - "studies/phs000466/TC06_C3DC_phs000466_DiagnClasfSystem-ICD-O-3.xlsx"
    - "studies/phs000470/TC10_C3DC_phs000470_CauseOfDeath-DueToThisDisease.xlsx"
